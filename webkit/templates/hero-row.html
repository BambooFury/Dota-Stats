<div class="dotastats-hero-row">
  <span class="dotastats-hero-dot">&#8226;</span>
  <div class="dotastats-hero-img-wrap">
    <img class="dotastats-hero-img" src="{{imgUrl}}" alt="{{displayName}}" />
    {{badgeHtml}}
  </div>
  <span class="dotastats-hero-name">{{displayName}}</span>
  <div class="dotastats-hero-stats">
    <span class="dotastats-hero-count">{{matchCount}} game</span>
    <span class="dotastats-hero-wr {{wrClass}}">{{wr}}%</span>
  </div>
</div>
