<div class="dotastats-widget">
  <div class="dotastats-main dotastats-main--fallback">
    <img class="dotastats-rank-img" src="{{rankImgUrl}}" alt="{{rankName}}" />
    <div class="dotastats-info">
      {{nameHtml}}
      <div class="dotastats-rank-label {{rankLabelClass}}">{{rankLabel}}</div>
      <div class="dotastats-stats-row">
        <span><span class="dotastats-stat-val">{{matches}}</span> matches</span>
        <span><span class="dotastats-stat-val">{{winrate}}</span> WR</span>
        <span class="dotastats-stat-val">{{mmrText}}</span>
      </div>
    </div>
  </div>
  <div class="dotastats-fallback-notice">&#9888; Stats service is experiencing issues &nbsp;&middot;&nbsp; via OpenDota</div>
</div>
