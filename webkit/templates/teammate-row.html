<div class="dotastats-hero-row">
  <span class="dotastats-hero-dot">&#8226;</span>
  <a class="dotastats-profile-link" href="{{profileUrl}}"><img class="dotastats-teammate-avatar" src="{{avatarUrl}}" alt="{{name}}" /></a>
  <div class="dotastats-teammate-name-wrap">
    <a class="dotastats-teammate-name" href="{{profileUrl}}">{{name}}</a>{{privateBadgeInline}}
  </div>
  <div class="dotastats-hero-stats">
    <span class="{{wrClass}}">{{wr}}%</span>
    <span class="dotastats-hero-count">{{matchCount}} game</span>
  </div>
</div>
