<div class="dotastats-expand-btn" id="dotastats-expand-btn-{{steamId}}" data-dotastats-steamid="{{steamId}}">
  <span class="dotastats-expand-inner">
    <span id="dotastats-arrow-{{steamId}}" class="dotastats-expand-arrow">{{chevronIcon}}</span>
    More
  </span>
</div>
<div id="dotastats-expand-{{steamId}}" class="dotastats-expand-panel">
  <div id="dotastats-recent-{{steamId}}" class="dotastats-recent-matches">
    <div class="dotastats-heroes-title dotastats-heroes-title--compact">Recent Matches</div>
    <div class="dotastats-recent-row">
      <div class="dotastats-skel-block dotastats-skel-w36 dotastats-skel-h22 dotastats-skel-radius-4"></div>
      <div class="dotastats-skel-block dotastats-skel-w36 dotastats-skel-h22 dotastats-skel-radius-4"></div>
      <div class="dotastats-skel-block dotastats-skel-w36 dotastats-skel-h22 dotastats-skel-radius-4"></div>
      <div class="dotastats-skel-block dotastats-skel-w36 dotastats-skel-h22 dotastats-skel-radius-4"></div>
      <div class="dotastats-skel-block dotastats-skel-w36 dotastats-skel-h22 dotastats-skel-radius-4"></div>
    </div>
  </div>
  {{activityHtml}}
  <div class="dotastats-hero-row dotastats-hero-row--role">
    <span class="dotastats-hero-dot">&#8226;</span>
    <span class="dotastats-hero-name">Main Role</span>
    <div class="dotastats-hero-stats">
      <span id="dotastats-role-{{steamId}}" class="dotastats-role-placeholder">&#8212;</span>
    </div>
  </div>
  <div id="dotastats-teammates-{{steamId}}">
    <div class="dotastats-teammates">
      <div class="dotastats-heroes-title dotastats-heroes-title--compact">Teammates</div>
      <div class="dotastats-skel-row dotastats-skel-row--tight">
        <div class="dotastats-skel-block dotastats-skel-dot"></div>
        <div class="dotastats-skel-block dotastats-skel-avatar"></div>
        <div class="dotastats-skel-block dotastats-skel-w80 dotastats-skel-h11"></div>
        <div class="dotastats-skel-stat-pair">
          <div class="dotastats-skel-block dotastats-skel-w36 dotastats-skel-h11"></div>
          <div class="dotastats-skel-block dotastats-skel-w28 dotastats-skel-h11"></div>
        </div>
      </div>
      <div class="dotastats-skel-row dotastats-skel-row--tight">
        <div class="dotastats-skel-block dotastats-skel-dot"></div>
        <div class="dotastats-skel-block dotastats-skel-avatar"></div>
        <div class="dotastats-skel-block dotastats-skel-w80 dotastats-skel-h11"></div>
        <div class="dotastats-skel-stat-pair">
          <div class="dotastats-skel-block dotastats-skel-w36 dotastats-skel-h11"></div>
          <div class="dotastats-skel-block dotastats-skel-w28 dotastats-skel-h11"></div>
        </div>
      </div>
      <div class="dotastats-skel-row dotastats-skel-row--tight">
        <div class="dotastats-skel-block dotastats-skel-dot"></div>
        <div class="dotastats-skel-block dotastats-skel-avatar"></div>
        <div class="dotastats-skel-block dotastats-skel-w80 dotastats-skel-h11"></div>
        <div class="dotastats-skel-stat-pair">
          <div class="dotastats-skel-block dotastats-skel-w36 dotastats-skel-h11"></div>
          <div class="dotastats-skel-block dotastats-skel-w28 dotastats-skel-h11"></div>
        </div>
      </div>
    </div>
  </div>
</div>
